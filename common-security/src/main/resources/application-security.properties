# TLS/mTLS settings
tls.dir=${TLS_DIR:Y:/SOP-info}
keystore.password=${TLS_KEYSTORE_PASSWORD:4Ndet0wn!}
truststore.password=${TLS_TRUSTSTORE_PASSWORD:4Ndet0wn!}

# SSL bundle
spring.ssl.bundle.jks.app.key.alias=1

spring.ssl.bundle.jks.app.keystore.location=file:${tls.dir}/${CERTIFICATE_FILENAME:${bc.qualifier}.p12}
spring.ssl.bundle.jks.app.keystore.password=${keystore.password}
spring.ssl.bundle.jks.app.keystore.type=${KEYSTORE_TYPE:PKCS12}

spring.ssl.bundle.jks.app.truststore.location=file:${tls.dir}/${ROOT_CA:internal-ca-trust.p12}
spring.ssl.bundle.jks.app.truststore.password=${truststore.password}
spring.ssl.bundle.jks.app.truststore.type=${TRUSTSTORE_TYPE:PKCS12}

# Use bundle settings
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.bundle=${SSL_BUNDLE_NAME:app}
server.ssl.client-auth=${SERVER_SSL_CLIENT_AUTH:need}
security.enabled=${SECURITY_ENABLED:true}

#mtls settings for sagas
mtls.enabled=${MTLS_ENABLED:false}

# Comma-separated list
server.ssl.enabled-protocols=${SERVER_SSL_ENABLED_PROTOCOLS:TLSv1.2,TLSv1.3}

#disable auto security chain
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration}

