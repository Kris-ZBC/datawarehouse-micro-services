bc.qualifier=${BC_QUALIFIER:gateway_admin}
server.port=${SERVER_PORT:10458}

# Internal mTLS configuration
registration-saga.base-url=${REGISTRATION_SAGA_BASE_URL:http://bc-registration-saga.sop.local:8345}
sop.base-url=${SOP_BASE_URL:http://bc-sop.sop.local:9453}
login.base-url=${LOGIN_BASE_URL:http://bc-login.sop.local:9455}

mtls.enabled=${MTLS_ENABLED:true}

external.mtls.allowed-callers=${EXTERNAL_MTLS_ALLOWLIST:TBD}
security.enabled=${SECURITY_ENABLED:true}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}

# NEW — must match gw-common's cookie exactly (same name, same domain
# scope) so a session started at gw-common is recognized here too.
sop.session-cookie.name=${SESSION_COOKIE_NAME:SOP_SESSION}
sop.session-cookie.cache-ttl-seconds=${SESSION_CACHE_TTL_SECONDS:30}
 
# NEW — dev convenience only, see CorsProps javadoc.
sop.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.sop.local:*}

# TLS configuration
spring.ssl.bundle.jks.app.keystore.location=file:${tls.dir}/${CERTIFICATE_FILENAME:gateway-admin.p12}

# virtual threads config
common.threads.virtual.enabled=true
common.threads.virtual.tomcat-threads-max=500
common.threads.virtual.max-connections=20000
common.threads.virtual.connection-timeout=30000